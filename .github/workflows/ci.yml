name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visacrm
          POSTGRES_PASSWORD: visacrm
          POSTGRES_DB: visacrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://visacrm:visacrm@localhost:5432/visacrm_test
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out as its merge commit; its first parent is the base.
          fetch-depth: 2
      # Migrations are not edited after merge (CLAUDE.md → «Как работать»): a pull request
      # only adds files to migrations/versions. .claude/hooks/guard-migrations.cjs stops such
      # edits inside Claude Code; this catches the rest.
      - name: Merged migrations are unchanged
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only --diff-filter=DMR HEAD^1 HEAD -- migrations/versions)"
          if [ -n "$changed" ]; then
            echo "Merged migrations edited, renamed or removed (add a new revision instead):"
            echo "$changed"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build

  # Forms in a real browser against the app with demo data (frontend/e2e): the fields of
  # a row line up in both languages and at every width.
  ui:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visacrm
          POSTGRES_PASSWORD: visacrm
          POSTGRES_DB: visacrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A throwaway database of this run only: these are not secrets.
      DATABASE_URL: postgresql+asyncpg://visacrm:visacrm@localhost:5432/visacrm
      ENV: staging
      DEMO_PASSWORD: ci-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the app with demo data
        run: |
          (cd frontend && npm ci && npm run build)
          cd backend
          uv sync
          export VAULT_MASTER_KEY="$(uv run python -m app.cli generate-master-key)"
          uv run alembic upgrade head
          uv run python -m app.cli seed-demo --specialists 1 --clients 30
          # From the venv, not «uv run»: see the security job.
          nohup .venv/bin/uvicorn app.main:app --port 8000 > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done
          cat /tmp/app.log; exit 1
      - name: Browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Known vulnerabilities in dependencies block the merge; the ZAP scan of the running
  # app (with demo data, like the staging stand) is a report to read, in the run's
  # artifacts. docs/staging.md → «Проверка на уязвимости».
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visacrm
          POSTGRES_PASSWORD: visacrm
          POSTGRES_DB: visacrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A throwaway database of this run only: these are not secrets.
      DATABASE_URL: postgresql+asyncpg://visacrm:visacrm@localhost:5432/visacrm
      ENV: staging
      DEMO_PASSWORD: ci-demo-password
      DEMO_TOTP_SECRET: JBSWY3DPEHPK3PXP
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python dependencies with known vulnerabilities
        working-directory: backend
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip --progress-spinner off
      - name: npm dependencies with known high or critical vulnerabilities
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Start the app with demo data
        run: |
          (cd frontend && npm run build)
          cd backend
          uv sync
          export VAULT_MASTER_KEY="$(uv run python -m app.cli generate-master-key)"
          uv run alembic upgrade head
          uv run python -m app.cli seed-demo --specialists 1 --clients 30
          # From the venv, not «uv run»: a running uv holds the cache lock and setup-uv's
          # cache pruning at the end of the job would wait for it until it fails.
          nohup .venv/bin/uvicorn app.main:app --port 8000 > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done
          cat /tmp/app.log; exit 1
      - name: ZAP baseline scan
        continue-on-error: true
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8000 -r zap-report.html -J zap-report.json -I
      - uses: actions/upload-artifact@v4
        if: always()
        # The report is for reading, like the scan: a full artifact quota must not fail the job
        # (the scan's summary is in the job log anyway).
        continue-on-error: true
        with:
          name: zap-report
          path: zap/
          if-no-files-found: ignore
          # Kept a week, not 90 days, so the reports do not fill the account's artifact quota.
          retention-days: 7
