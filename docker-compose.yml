# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: visacrm
      POSTGRES_PASSWORD: visacrm
      POSTGRES_DB: visacrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
