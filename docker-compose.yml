# Local Postgres and a mail catcher for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: visacrm
      POSTGRES_PASSWORD: visacrm
      POSTGRES_DB: visacrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Catches every letter the app sends: SMTP on 1025, letters at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
