[project]
name = "visacrm-backend"
version = "0.1.0"
description = "VisaCRM backend: FastAPI + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pyotp>=2.9",
    "segno>=1.6",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "boto3>=1.35",
    "lxml>=5.3",
    "sentry-sdk[fastapi]>=2.76,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pytest-asyncio>=0.25",
]
# Tools the CI security job runs from the lock (`uv run --frozen --only-group audit`), so
# their versions and hashes are pinned in uv.lock. Not a default group: `uv sync` and the
# image do not install it.
audit = [
    "pip-audit>=2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# G: a log call keeps its values apart from its template (no f-strings, % or format), so the
# error reports can tell the two apart (app/core/error_reports.py).
select = ["E", "F", "I", "UP", "B", "SIM", "G"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A call SQLAlchemy is about to drop fails the test that makes it.
filterwarnings = ["error::sqlalchemy.exc.SADeprecationWarning"]
